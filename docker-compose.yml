services:

  postgres:
    image: postgres:16
    container_name: mcp-auditor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mcp
      POSTGRES_PASSWORD: mcp
      POSTGRES_DB: mcp_auditor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: mcp-auditor-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data: